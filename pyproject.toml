[project]
name = "now-playing"
version = "0.1.0"
description = "Zbieranie danych o odtwarzanych utworach - z API Spotify i LastFM"
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "spotify",
    "lastfm",
    "postgresql",
    "music-tracking",
    "now-playing",
]
dependencies = [
    "psycopg2-binary>=2.9.13",
    "python-json-logger>=4.2.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "spotipy>=2.26.0",
    "sqlalchemy>=2.0.54",
]
